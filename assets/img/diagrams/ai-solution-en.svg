<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Inter,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#ffffff"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0E7490">AI Solution — Education Data Platform</text>

  <!-- Tableau (presentation) -->
  <rect x="280" y="70" width="300" height="64" rx="10" fill="#FDF2F2" stroke="#9F1239" stroke-width="1.8"/>
  <text x="430" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#9F1239">Tableau</text>
  <text x="430" y="117" text-anchor="middle" font-size="11" fill="#64748B">weekly KPI dashboard</text>

  <!-- ASP.NET (application) -->
  <rect x="280" y="180" width="300" height="70" rx="10" fill="#F0F7F6" stroke="#0E7490" stroke-width="1.8"/>
  <text x="430" y="209" text-anchor="middle" font-size="15" font-weight="700" fill="#0E7490">ASP.NET Core MVC (.NET 8)</text>
  <text x="430" y="228" text-anchor="middle" font-size="11" fill="#64748B">application layer</text>

  <!-- SQL Server (data) -->
  <rect x="280" y="300" width="300" height="70" rx="10" fill="#EFF4FA" stroke="#1E4E79" stroke-width="1.8"/>
  <text x="430" y="329" text-anchor="middle" font-size="15" font-weight="700" fill="#1E4E79">SQL Server</text>
  <text x="430" y="348" text-anchor="middle" font-size="11" fill="#64748B">12+ tables · 10 stored procs</text>

  <!-- data chain note -->
  <rect x="620" y="180" width="200" height="120" rx="10" fill="#F6F8FA" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="720" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Data chain</text>
  <text x="720" y="234" text-anchor="middle" font-size="11" fill="#64748B">data validation</text>
  <text x="720" y="254" text-anchor="middle" font-size="11" fill="#64748B">soft-delete</text>
  <text x="720" y="274" text-anchor="middle" font-size="11" fill="#64748B">cascade updates</text>

  <!-- arrows -->
  <line x1="430" y1="134" x2="430" y2="176" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="430" y1="250" x2="430" y2="296" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="580" y1="335" x2="616" y2="240" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
</svg>
