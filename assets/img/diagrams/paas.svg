<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Inter,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#ffffff"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0E7490">PaaS Cloud Management Console — Frontend</text>

  <!-- Console -->
  <rect x="28" y="190" width="200" height="72" rx="10" fill="#F0F7F6" stroke="#0E7490" stroke-width="1.8"/>
  <text x="128" y="219" text-anchor="middle" font-size="15" font-weight="700" fill="#0E7490">Bootstrap 4 Console</text>
  <text x="128" y="238" text-anchor="middle" font-size="11" fill="#64748B">Beagle Admin · jQuery · Chart.js</text>

  <!-- pages -->
  <g font-size="12.5" font-weight="600" fill="#1F2937">
    <rect x="290" y="80" width="150" height="50" rx="9" fill="#EFF4FA" stroke="#1E4E79" stroke-width="1.4"/>
    <text x="365" y="109" text-anchor="middle">Applications (Pod)</text>
    <rect x="470" y="80" width="150" height="50" rx="9" fill="#EFF4FA" stroke="#1E4E79" stroke-width="1.4"/>
    <text x="545" y="109" text-anchor="middle">Services</text>
    <rect x="650" y="80" width="160" height="50" rx="9" fill="#EFF4FA" stroke="#1E4E79" stroke-width="1.4"/>
    <text x="730" y="109" text-anchor="middle">Routes (Domains)</text>

    <rect x="290" y="190" width="150" height="50" rx="9" fill="#F0F7F6" stroke="#0E7490" stroke-width="1.4"/>
    <text x="365" y="219" text-anchor="middle">Volumes</text>
    <rect x="470" y="190" width="150" height="50" rx="9" fill="#F0F7F6" stroke="#0E7490" stroke-width="1.4"/>
    <text x="545" y="219" text-anchor="middle">Images</text>
    <rect x="650" y="190" width="160" height="50" rx="9" fill="#F0F7F6" stroke="#0E7490" stroke-width="1.4"/>
    <text x="730" y="219" text-anchor="middle">Users</text>

    <rect x="380" y="300" width="200" height="50" rx="9" fill="#FDF2F2" stroke="#9F1239" stroke-width="1.4"/>
    <text x="480" y="329" text-anchor="middle">App Marketplace</text>
  </g>

  <!-- arrows -->
  <line x1="228" y1="226" x2="286" y2="226" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="355" y1="226" x2="355" y2="160" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="480" y1="226" x2="480" y2="160" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="480" y1="226" x2="480" y2="296" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#arr)"/>
</svg>
