<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Inter,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#ffffff"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0E7490">AI Solution — Education Data Platform</text>

  <!-- ASP.NET -->
  <rect x="28" y="190" width="220" height="72" rx="10" fill="#F0F7F6" stroke="#0E7490" stroke-width="1.8"/>
  <text x="138" y="219" text-anchor="middle" font-size="15" font-weight="700" fill="#0E7490">ASP.NET Core MVC (.NET 8)</text>
  <text x="138" y="238" text-anchor="middle" font-size="11" fill="#64748B">application layer</text>

  <!-- SQL Server -->
  <rect x="320" y="190" width="240" height="72" rx="10" fill="#EFF4FA" stroke="#1E4E79" stroke-width="1.8"/>
  <text x="440" y="219" text-anchor="middle" font-size="15" font-weight="700" fill="#1E4E79">SQL Server</text>
  <text x="440" y="238" text-anchor="middle" font-size="11" fill="#64748B">12+ tables · 10 stored procs</text>

  <!-- Tableau -->
  <rect x="632" y="190" width="200" height="72" rx="10" fill="#FDF2F2" stroke="#9F1239" stroke-width="1.8"/>
  <text x="732" y="219" text-anchor="middle" font-size="15" font-weight="700" fill="#9F1239">Tableau</text>
  <text x="732" y="238" text-anchor="middle" font-size="11" fill="#64748B">weekly KPI dashboard</text>

  <!-- data chain note -->
  <rect x="320" y="300" width="240" height="62" rx="10" fill="#F6F8FA" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="440" y="327" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">数据链路</text>
  <text x="440" y="346" text-anchor="middle" font-size="11" fill="#64748B">联表查询 · 数据校验 · 软删除 · 级联</text>

  <!-- arrows -->
  <line x1="248" y1="226" x2="316" y2="226" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="560" y1="226" x2="628" y2="226" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="440" y1="262" x2="440" y2="296" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="4 3"/>
</svg>
