<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Inter,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#ffffff"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0E7490">PaaS 云管理控制台 —— 前端</text>

  <!-- 控制台 -->
  <rect x="24" y="150" width="210" height="150" rx="12" fill="#F0F7F6" stroke="#0E7490" stroke-width="2"/>
  <text x="129" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#0E7490">Bootstrap 4 控制台</text>
  <text x="129" y="228" text-anchor="middle" font-size="11" fill="#64748B">Beagle Admin · jQuery</text>
  <text x="129" y="247" text-anchor="middle" font-size="11" fill="#64748B">Chart.js</text>

  <!-- 功能卡片 -->
  <g font-size="13" font-weight="600" fill="#1F2937">
    <rect x="280" y="66" width="180" height="56" rx="9" fill="#EFF4FA" stroke="#1E4E79" stroke-width="1.4"/>
    <text x="370" y="99" text-anchor="middle">应用（Pod）</text>
    <rect x="480" y="66" width="180" height="56" rx="9" fill="#EFF4FA" stroke="#1E4E79" stroke-width="1.4"/>
    <text x="570" y="99" text-anchor="middle">服务</text>
    <rect x="680" y="66" width="150" height="56" rx="9" fill="#EFF4FA" stroke="#1E4E79" stroke-width="1.4"/>
    <text x="755" y="99" text-anchor="middle">路由（域名）</text>

    <rect x="280" y="150" width="180" height="56" rx="9" fill="#F0F7F6" stroke="#0E7490" stroke-width="1.4"/>
    <text x="370" y="183" text-anchor="middle">存储卷</text>
    <rect x="480" y="150" width="180" height="56" rx="9" fill="#F0F7F6" stroke="#0E7490" stroke-width="1.4"/>
    <text x="570" y="183" text-anchor="middle">镜像</text>
    <rect x="680" y="150" width="150" height="56" rx="9" fill="#F0F7F6" stroke="#0E7490" stroke-width="1.4"/>
    <text x="755" y="183" text-anchor="middle">用户</text>

    <rect x="430" y="250" width="250" height="56" rx="9" fill="#FDF2F2" stroke="#9F1239" stroke-width="1.4"/>
    <text x="555" y="283" text-anchor="middle" fill="#9F1239">应用市场</text>
  </g>

  <!-- 连接线 -->
  <line x1="234" y1="225" x2="276" y2="225" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
</svg>
