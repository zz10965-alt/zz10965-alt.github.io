<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Inter,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="860" height="470" rx="14" fill="#ffffff"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#B45309">AI Conversational Agent — RAG Pipeline</text>

  <!-- Client -->
  <rect x="28" y="200" width="150" height="62" rx="10" fill="#FFF7EE" stroke="#B45309" stroke-width="1.6"/>
  <text x="103" y="227" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">User</text>
  <text x="103" y="246" text-anchor="middle" font-size="11" fill="#64748B">voice / text</text>

  <!-- FastAPI -->
  <rect x="250" y="200" width="210" height="72" rx="10" fill="#FFF7EE" stroke="#B45309" stroke-width="1.8"/>
  <text x="355" y="229" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">FastAPI 0.104.1</text>
  <text x="355" y="248" text-anchor="middle" font-size="11" fill="#64748B">API layer</text>

  <!-- LangChain -->
  <rect x="250" y="90" width="210" height="62" rx="10" fill="#EFF4FA" stroke="#1E4E79" stroke-width="1.6"/>
  <text x="355" y="117" text-anchor="middle" font-size="15" font-weight="700" fill="#1E4E79">LangChain 0.0.335</text>
  <text x="355" y="136" text-anchor="middle" font-size="11" fill="#64748B">agent orchestration</text>

  <!-- Qdrant -->
  <rect x="540" y="70" width="252" height="62" rx="10" fill="#F0F7F6" stroke="#0E7490" stroke-width="1.6"/>
  <text x="666" y="97" text-anchor="middle" font-size="15" font-weight="700" fill="#0E7490">Qdrant 1.5.0</text>
  <text x="666" y="116" text-anchor="middle" font-size="11" fill="#64748B">vector store · retrieval</text>

  <!-- Redis -->
  <rect x="540" y="200" width="252" height="62" rx="10" fill="#FDF2F2" stroke="#9F1239" stroke-width="1.6"/>
  <text x="666" y="227" text-anchor="middle" font-size="15" font-weight="700" fill="#9F1239">Redis</text>
  <text x="666" y="246" text-anchor="middle" font-size="11" fill="#64748B">conversation memory</text>

  <!-- OpenAI -->
  <rect x="540" y="330" width="252" height="62" rx="10" fill="#EFF4FA" stroke="#1E4E79" stroke-width="1.6"/>
  <text x="666" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#1E4E79">OpenAI 1.2.4</text>
  <text x="666" y="376" text-anchor="middle" font-size="11" fill="#64748B">LLM · Whisper · TTS</text>

  <!-- arrows -->
  <line x1="178" y1="231" x2="246" y2="231" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="355" y1="152" x2="355" y2="196" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="460" y1="210" x2="536" y2="101" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="460" y1="236" x2="536" y2="236" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="460" y1="250" x2="536" y2="355" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr)"/>

  <text x="500" y="152" text-anchor="middle" font-size="11" fill="#0E7490" font-weight="600">RAG 检索</text>
  <text x="500" y="300" text-anchor="middle" font-size="11" fill="#64748B">生成</text>
